      # MAZE: The World's Most Challenging Puzzle

      In 1985, Christopher Manson published *MAZE: Solve the World's Most Challenging Puzzle*, an illustrated puzzle book that has captivated solvers for decades. The book presents 45 interconnected rooms, each a full-page illustration filled with hidden clues, symbols, and riddles.

      The challenge: find the shortest path from Room 1 to Room 45 and back, while decoding the hidden riddle along the way.

      The video below introduced me to the book and got me thinking about the graph representations in the book.

      This project is an exercise in exploring different ways to visualize and analyze different graphs.

  - type: "youtube"
    videoId: "FFlg-6Y9gHE"
    title: "MAZE Puzzle Exploration"

  - type: "markdown"
    content: |
      ## The Challenge

      MAZE is deceptively simple in concept but fiendishly difficult in execution:

      1. **Navigate the maze** - Find the shortest path through 45 rooms
      2. **Decode the riddle** - Hidden messages in each room spell out a question
      3. **Find the answer** - The final solution requires understanding all the clues

      ## Project Goals

      This project aims to:
      - Model the maze as a graph and find optimal paths
      - Use image analysis to identify recurring symbols and patterns
      - Build an interactive visualization of the maze structure
      - Document the solving process and insights

  - type: "markdown"
    content: |
