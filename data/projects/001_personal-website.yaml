#      ## Design Decisions
#
#      ### Why YAML for Data?
#
#      - Human-readable and easy to edit
#      - Supports multi-line strings (perfect for markdown content)
#      - Schema-free flexibility
#      - Git-friendly (easy to track changes)
#
#      ### Why Cell-Based Projects?
#
#      The notebook style allows mixing:
#      - Explanatory text (markdown)
#      - Working code examples
#      - Visualizations (diagrams, images, videos)
#
#      This makes projects self-documenting and educational.
#
#      ### Why Build-Time Conversion?
#
#      Converting YAML to JSON at build time means:
#      - Faster runtime performance (JSON parsing is faster)
#      - Type checking opportunities
#      - Validation before deployment
#      - No runtime YAML parser needed (smaller bundle size)
