#      ## How To Guides
#
#      ### Adding a New Project
#
#      1. Create a new YAML file in `data/projects/` (e.g., `004_my-project.yaml`)
#      2. Use the project file structure template above
#      3. Set `visible: true` to publish immediately, or `visible: false` to work on it privately
#      4. Run `npm run dev` - the project will be automatically loaded
#
#      ### Updating the Resume
#
#      Edit `data/resume.yaml` directly:
#      - Add work experience to the `work_experience:` section
#      - Add research projects under `research_experience:`
#      - Add skills to the `skills:` section
#      - Tag content appropriately: `tags: [research, software, data-science, industry]`
#
#      ### Toggling Project Visibility
#
#      To hide a project without deleting it:
#      ```yaml
#      visible: false  # Project won't appear on site
#      ```
#
#      To show a project:
#      ```yaml
#      visible: true   # Project will appear on site
#      ```
#
#      This is useful for:
#      - Working on projects privately before publishing
#      - Temporarily hiding outdated projects
#      - A/B testing different project presentations
#
#      ### Updating a Project
#
#      1. Edit the project's YAML file in `data/projects/`
#      2. Update the `updated:` field to today's date
#      3. Save - the dev server will hot-reload automatically
