education:
  - degree: Ph.D. Physics
    institution: Vanderbilt University
    location: Nashville, TN, USA
    dates: 2017-2025
    confer_date: 2025-05-09
    gpa: 3.629
    credit_hours: 72
    thesis: "The Development of a Robust Framework to Unlock the Full Potential of Explicit pH Modeling: An Exploration into Simulating pH within a Mathematical Optimization Framework"
    tags: [research, software, data-science, industry]
    relevant_coursework:
      physics:
        - course: "PHYS 8005 - Mathematical Methods for Physicists"
          grade: A
          description: "Linear spaces and operators; matrix algebra; differential equations; Green's function; and complex analysis. May include variational calculus; perturbation methods; group theory."
          skills: [Linear Algebra, Differential Equations, Complex Analysis, Perturbation Methods, Green's Functions]
        - course: "PHYS 8010 - Particle/Continuum Mechanics"
          grade: A-
          description: "Least action principle, Lagrange formalism, conservation laws, two-body problem, small-amplitude vibrations, non-inertial reference frames, canonical formalism, rigid body motion, continuous media, and field theory. Includes programming on scientific work stations."
          skills: [Lagrangian Mechanics, Hamiltonian Mechanics, Scientific Programming, Mathematical Modeling, Field Theory]
        - course: "PHYS 8030 - Quantum Mechanics"
          grade: A
          description: "Underlying assumptions. Schrodinger equation: interpretation, discrete and continuous basis, change of basis. One-dimensional examples: square potential, harmonic oscillator. Uncertainty relations, symmetries and their implications, angular momentum, hydrogen atom, spin, systems with N-degrees of freedom; time independent perturbation theory, Fermi's golden rule."
          skills: [Quantum Theory, Perturbation Theory, Mathematical Physics, Symmetry Analysis]
        - course: "PHYS 8020 - Advanced Electrodynamics"
          grade: A-
          description: "Electrostatics, potentials, boundary value problems, multipole moments, polarization, magnetostatics, Maxwell's equations, electromagnetic wave propagation, dissipative and conductive media."
          skills: [Electromagnetic Theory, Boundary Value Problems, PDEs, Maxwell's Equations]
        - course: "PHYS 8040 - Statistical Mechanics"
          grade: A
          description: "Phase space, entropy and reversibility; ensemble theory; Fermi and Bose Statistics; systems of interacting particles; equation of state, critical phenomena, and phase transitions; pairing and superfluidity."
          skills: [Statistical Analysis, Thermodynamics, Phase Transitions, Ensemble Theory]
        - course: "PHYS 8158 - Photons/Atoms/Molecules/Solids"
          grade: A-
          description: "Macroscopic optical properties of solids. Lorentz model of optical excitation, radiative and non-radiative relaxation. Coherence and dephasing in two-level systems. Interband transitions and luminescence. Optical properties of quantum-confined systems. Excitons, phonons, plasmons, and polaritons. Lasers, Raman and Brillouin scattering, nonlinear optical phenomenology."
          skills: [Spectroscopy, Optical Physics, Solid State Physics, Nonlinear Optics]
      systems_biology:
        - course: "PHYS 8105 - Special Topics: Instrumentation for Automated Biology"
          grade: A
          description: "Current topics in experimental physics relevant to research areas in the department, such as biological, condensed-matter, elementary-particle, nuclear, and optical physics, astronomy, astrophysics and cosmology."
          skills: [Laboratory Instrumentation, Experimental Design, Automation, Biophysics]
        - course: "PHYS 8122 - Physics of Living Systems"
          grade: A-
          description: "Physical principles applied to biological phenomena. Development of physical models of biological systems on scales ranging from molecules to organisms. Biological applications of mechanics, thermodynamics, and dynamical systems."
          skills: [Mathematical Modeling, Biophysics, Dynamical Systems, Biological Systems]
        - course: "PHYS 8126 - Theoretical Systems Biology"
          grade: A+
          description: "Introduction to systems biology from the perspective of the emergence of complexity in toy models. Simple biological subsystems, their reductionist and equivalent models, and measurements required to specify model architecture and parameters. Multiple interconnected organs-on-chips as dynamic biological systems that can model organismal biology."
          skills: [Systems Biology, Model Development, Complexity Theory, Organ-on-Chip Systems]
        - course: "PHYS 8124 - Physics Measurement in Biological Systems"
          grade: A+
          description: "A survey of the state of the art in quantitative physical measurement techniques applied to cellular or molecular physiology. Topics include the basis for generation, measurement, and control of the transmembrane potential; electrochemical instrumentation; optical spectroscopy and imaging; X-ray diffraction for determination of macromolecular structure; magnetic resonance spectroscopy and imaging."
          skills: [Spectroscopy, Imaging, Electrochemistry, X-ray Diffraction, MRI/NMR]
      bioinformatics:
        - course: "BMIF 6310 - Foundations of Bioinformatics"
          grade: A-
          description: "Survey course introducing experimental context and implementation of key algorithms in bioinformatics. Topics include basic biochemistry and molecular biology, algorithms for matching and aligning biological sequences, high-throughput DNA sequencing, genome assembly, gene annotation, proteomic mass spectrometry, protein structure inference and prediction, transcriptional microarrays, genome-wide association studies, and biological networks including genetic regulatory networks and gene ontologies."
          skills: [Sequence Alignment, Genomics, Proteomics, Network Analysis, GWAS, Algorithm Implementation]
        - course: "BMIF 6315 - Methodological Foundations of BMIF"
          grade: B+
          description: "Foundational concepts in machine learning for biomedical informatics. Topics include probabilistic reasoning, Bayesian statistics, statistical foundations, Python programming for data science, deep learning theory, and challenges of high-dimensional data including the curse of dimensionality."
          skills: [Machine Learning, Bayesian Statistics, Python, Deep Learning, High-Dimensional Data Analysis]
        - course: "BMIF 6322 - Scientific Communication"
          grade: A-
          description: "Enhances students' skills in written and oral scientific communication. Covers categories of scientific writing, the peer review process, and ethical issues in research communication. Provides hands-on experience in writing papers, abstracts, and grant proposals; critiquing and copy editing; and preparing and giving presentations for scientific meetings."
          skills: [Technical Writing, Presentation Skills, Grant Writing, Peer Review, Scientific Communication]
      mathematics:
        - course: "MATH 6630 - Nonlinear Optimization"
          grade: C+
          description: "Mathematical modeling of optimization problems. Theory of unconstrained and constrained optimization, including convexity and the Karush-Kuhn-Tucker conditions. Derivative- and nonderivative-based methods."
          skills: [Mathematical Optimization, Convex Optimization, KKT Conditions, Numerical Methods]
        - course: "MATH 6710 - Graph Theory"
          grade: B-
          description: "The mathematical theory of networks. Traversing graphs using paths, cycles, and trails. Matchings and other graph factors. Coloring of vertices and edges. Connectivity and its relation to paths and flows. Embeddings of graphs in surfaces, especially the plane."
          skills: [Graph Theory, Network Analysis, Combinatorics, Algorithm Design]
      other:
        - course: "BCHM-GS 8336 - Biochemical Molecular Toxicology"
          grade: B
          description: "Chemical and biological aspects of toxicology and carcinogenesis, including basic principles and mechanisms, metabolism and enzymology, cellular biology, chemistry of reactive intermediates, tissue-specific toxicity, and a survey of several classes of environmentally important compounds and drugs."
          skills: [Biochemistry, Toxicology, Metabolism, Cellular Biology, Pharmacology]
        - course: "PHYS 8100 - Selected Topics: Physics of Machine Learning"
          grade: Audit
          description: "Survey course covering different techniques for machine learning, with emphasis on applications in physics and scientific computing."
          skills: [Machine Learning, Scientific Computing, Neural Networks, Data Analysis]
        - course: "RCRG 6303 - Responsible Conduct of Research"
          grade: P
          description: "Lectures and small group discussions about responsible conduct of research including individual and group responsibilities, recording and use of data, intellectual property and technology transfer, ethical questions in and about research, societal responsibility of researchers, and Federal and institutional guidelines."
          skills: [Research Ethics, Data Management, Intellectual Property, Regulatory Compliance]

