research_experience:
  - title: Graduate Research Assistant
    institution: Vanderbilt University
    location: Nashville, TN
    dates: 2017-2025
    projects:
      - name: Explicit pH Models
        dates: 2024-2025
        description: "Development of a Julia-based explicit pH calculation within a mathematical optimization framework. Design considerations for automation, relational database representation compatibility, DFBA model embedding, and integration into a bioreactor digital twin."
        tags: [research, software, data-science]
        bullets:
          research:
            - "Developed Julia-based framework for explicit pH modeling, enabling integration with bioreactor digital twins"
            - "Designed system architecture for relational database compatibility and DFBA model embedding"
          software:
            - "Built mathematical optimization pipelines using JuMP and IPOPT for metabolic simulations"
            - "Designed PostgreSQL schema for storing and querying metabolic model parameters"
            - "Created automation pipeline for bioreactor digital twin integration"
          data-science:
            - "Developed optimization algorithms for explicit pH simulation in biological systems"
            - "Built data pipelines connecting metabolic models to relational databases"

      - name: Yeast Metabolism
        dates: 2020-2023
        description: "Investigation of various metabolic models for predicting, controlling, and estimating Saccharomyces cerevisiae metabolic state. Exploration of various embeddings of DFBA, PBE, and pH models in Julia, Python, and MATLAB."
        tags: [research, data-science]
        bullets:
          research:
            - "Implemented DFBA metabolic models in Julia, Python, and MATLAB for yeast fermentation prediction"
            - "Developed model predictive control strategies for metabolic systems"
          software:
            - "Implemented cross-language metabolic modeling framework (Julia, Python, MATLAB)"
            - "Built simulation pipelines for dynamic flux balance analysis"
          data-science:
            - "Built predictive models for yeast metabolic state estimation"
            - "Implemented DFBA, PBE, and pH models for fermentation optimization"

      - name: iPSC Secretomics
        dates: 2018-2019
        description: "Initial Ph.D. project focused on correlating iPSC secretomics to multiomic state. Sought to utilize DFBA and secretome-transcriptome correlation models to optimize iPSC to dopaminergic neuron differentiation protocols."
        tags: [research, data-science]
        bullets:
          research:
            - "Developed secretome-transcriptome correlation models for iPSC differentiation"
            - "Presented findings at Gordon Research Conferences (2018, 2019)"
          data-science:
            - "Built statistical models correlating secretomics to transcriptomic state"
            - "Developed data-driven approach to optimize cell differentiation protocols"

      - name: Fruit Fly Epithelium
        dates: 2017
        description: "Performed laser ablations to assess tensions present within Drosophila melanogaster pupae epithelium. Confocal imaging with cell wall localized GFP utilized to measure epithelial deformation mechanics."
        tags: [research]
        bullets:
          - "Performed laser ablations to assess epithelial tensions"
          - "Utilized confocal imaging with GFP to measure deformation mechanics"

